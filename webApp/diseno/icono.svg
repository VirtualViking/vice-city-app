<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
    <!-- Ícono de Vice City App: sol neón y palmeras a contraluz. Diseño propio. -->
    <defs>
        <path id="fronda" d="M0 0 C18 -10 44 -8 70 20 L62 14 L60 20 L52 10 L49 17 L42 7 L38 14 L31 5 L27 11 L20 3 L15 8 C10 4 5 3 0 4 Z"/>
        <g id="palmera">
            <path d="M62 220 C64 170 70 110 75 54 L82 54 C78 110 73 170 72 220 Z"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) rotate(-75)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) rotate(-40)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) rotate(-12)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) rotate(18)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) rotate(48)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) scale(-1 1) rotate(-75)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) scale(-1 1) rotate(-40)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) scale(-1 1) rotate(-12)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) scale(-1 1) rotate(18)"/>
            <use xlink:href="#fronda" href="#fronda" transform="translate(78 52) scale(-1 1) rotate(48)"/>
            <circle cx="76" cy="57" r="3"/>
            <circle cx="81" cy="58" r="3"/>
        </g>
        <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FF5FA2" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFC68A"/>
            <stop offset="0.5" stop-color="#FF9466"/>
            <stop offset="1" stop-color="#FF5FA2"/>
        </linearGradient>
        <clipPath id="recorteSol">
            <circle cx="256" cy="300" r="120"/>
        </clipPath>
    </defs>
    <rect width="512" height="512" fill="#211936"/>
    <circle cx="256" cy="300" r="230" fill="url(#brillo)"/>
    <circle cx="256" cy="300" r="120" fill="url(#sol)"/>
    <g clip-path="url(#recorteSol)" fill="#211936">
        <rect x="120" y="318" width="272" height="7"/>
        <rect x="120" y="342" width="272" height="10"/>
        <rect x="120" y="368" width="272" height="13"/>
    </g>
    <rect y="400" width="512" height="112" fill="#1A1330"/>
    <rect y="398" width="512" height="4" fill="#FF5FA2"/>
    <rect x="176" y="416" width="160" height="5" fill="#FF5FA2" opacity="0.55"/>
    <rect x="201" y="434" width="110" height="5" fill="#FF5FA2" opacity="0.4"/>
    <rect x="226" y="452" width="60" height="5" fill="#FF5FA2" opacity="0.25"/>
    <use xlink:href="#palmera" href="#palmera" transform="translate(10 92) scale(1.85)" fill="#120B24"/>
    <use xlink:href="#palmera" href="#palmera" transform="translate(512 180) scale(-1.2 1.2)" fill="#120B24"/>
</svg>