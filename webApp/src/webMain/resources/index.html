<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vice City App</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#211936">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- iOS: Safari no lee todo el manifest, necesita estas etiquetas -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vice City">

  <style>
    html, body { margin: 0; height: 100%; background: #211936; overflow: hidden; }
  </style>

  <script src="config.js"></script>
  <script>
    // Instalación de la app (Chrome y Edge en Android): el navegador avisa con "beforeinstallprompt" que se puede instalar.
    // Se guarda ese aviso para abrir la ventana de instalación desde el botón "Descargar esta app" de la bienvenida.
    var viceCityAvisoInstalacion = null;
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      viceCityAvisoInstalacion = evento;
    });
    window.addEventListener('appinstalled', function () { viceCityAvisoInstalacion = null; });
    function viceCityInstalar() {
      if (viceCityAvisoInstalacion === null) return false;
      viceCityAvisoInstalacion.prompt();
      viceCityAvisoInstalacion = null;
      return true;
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
</head>
<body>
<!-- Al final del body: Compose se monta sobre document.body -->
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
