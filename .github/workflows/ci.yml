# Compila y prueba el servidor en cada push y pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    # PostgreSQL para las pruebas de integración (base vacía en cada ejecución)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vicecity_test
          POSTGRES_USER: vicecity
          POSTGRES_PASSWORD: vicecity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vicecity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Pruebas del servidor
        env:
          TEST_DATABASE_URL: postgresql://vicecity:vicecity@localhost:5432/vicecity_test
        run: |
          chmod +x gradlew
          ./gradlew :server:test --no-daemon --console=plain
