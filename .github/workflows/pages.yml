# Compila la web (Wasm + respaldo JS) y la publica en GitHub Pages.
# La URL del backend se toma de la variable del repositorio API_BASE (Settings → Secrets and variables → Actions → Variables).
name: Publicar web en GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - webApp/**
      - shared/**
      - gradle/**
      - '*.kts'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar (Wasm + JS)
        run: |
          chmod +x gradlew
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --no-daemon --console=plain

      - name: Configurar la URL del backend
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then echo "::error::Falta la variable del repositorio API_BASE"; exit 1; fi
          printf 'var ViceCityConfig = {\n  apiBase: "%s"\n};\n' "$API_BASE" > webApp/build/dist/composeWebCompatibility/productionExecutable/config.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/composeWebCompatibility/productionExecutable

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
