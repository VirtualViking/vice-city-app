# Blueprint de Render: crea el servicio del backend desde este repositorio.
# Los valores con sync: false se piden al crear el servicio y nunca quedan en el repositorio.
services:
  - type: web
    name: vice-city-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/salud
    autoDeployTrigger: checksPass   # despliega solo si el CI de GitHub pasa
    buildFilter:
      paths:
        - server/**
        - shared/**
        - gradle/**
        - "*.kts"
        - Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CORS_ORIGENES
        value: https://virtualviking.github.io
      - key: JWT_SECRETO
        generateValue: true          # Render genera una clave aleatoria
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ESTABLECIMIENTO_NOMBRE
        sync: false
